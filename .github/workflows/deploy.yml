name: Deploy

# Publishes the production bundle on every push to main. This is the
# "merged PR results in an updated public URL, automatically" half of
# issue #19 — see docs/hosting-and-deployment.md for the reasoning.
#
# Target: GitHub Pages, served from a Camunda-controlled custom domain
# (recommended: demos.camunda.io, a separate origin from docs — see
# docs/hosting-and-deployment.md, decision 1). Until that CNAME/DNS work
# is approved by infra, this still deploys to the default
# <org>.github.io/<repo> Pages URL, which is a real, working, automatic
# public URL — the CNAME can be layered on later without touching this
# workflow (see the commented-out CNAME example in the build job below).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Where the built assets are rooted. This repo is **internal**, and an
          # access-controlled Pages site is served from the ROOT of a generated
          # host (https://<random>.pages.github.io/) — not from /<repo>/. The
          # /<repo>/ project-path convention applies only to a *public* repo on
          # <org>.github.io. Rooting assets under /<repo>/ made every asset 404,
          # and Pages answered each one with its HTML 404 page, so the browser
          # refused the stylesheets on MIME grounds:
          #   Refused to apply style from '.../web-demo-framework/assets/index-*.css'
          #   because its MIME type ('text/html') is not a supported stylesheet
          #   MIME type
          # A custom domain (decision 1) is also served at the root, so "/" stays
          # correct there. Set the PAGES_BASE_PATH repo variable to override —
          # e.g. "/web-demo-framework/" if this repo is ever made public and
          # served as a project site.
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      # If/when a custom domain is approved (decision 1 in the hosting
      # doc), drop a CNAME file into the published output here, e.g.:
      #   - run: echo "demos.camunda.io" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
