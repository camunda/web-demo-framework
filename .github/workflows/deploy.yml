name: Deploy

# Publishes the production bundle on every push to main. This is the
# "merged PR results in an updated public URL, automatically" half of
# issue #19 — see docs/hosting-and-deployment.md for the reasoning.
#
# Target: GitHub Pages, served from a Camunda-controlled custom domain
# (recommended: demos.camunda.io, a separate origin from docs — see
# docs/hosting-and-deployment.md, decision 1). Until that CNAME/DNS work
# is approved by infra, this still deploys to the repo's default Pages
# URL, which is a real, working, automatic URL — the CNAME can be layered
# on later without touching this workflow (see the commented-out CNAME
# example in the deploy job below).
#
# Publishing target: the `gh-pages` branch, NOT `actions/deploy-pages`.
# GitHub Pages serves exactly one source per repo, and preview.yml needs
# that source to be a branch so per-PR previews under pr-preview/pr-<n>/
# are actually reachable. While this repo was on the `actions/deploy-pages`
# ("GitHub Actions") source, every preview commit landed on a branch
# nothing served, and the link posted on each PR silently resolved to this
# production deployment instead — see docs/hosting-and-deployment.md,
# decision 2. Consequences of publishing from a branch:
#   - `clean-exclude: pr-preview/` — main's deployment must not delete the
#     umbrella directory that holds live PR previews.
#   - `force: false` — rebase rather than force-push, so a preview
#     published concurrently with a main deploy isn't clobbered.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Where the built assets are rooted. This repo is public, so Pages
          # serves it as a *project site* at https://camunda.github.io/<repo>/
          # and assets must be rooted under that path. Root them at "/" and
          # every asset 404s — and Pages answers each 404 with HTML, so the
          # browser then refuses the stylesheets on MIME grounds:
          #   Refused to apply style from '.../assets/index-*.css' because its
          #   MIME type ('text/html') is not a supported stylesheet MIME type
          # The inverse held while the repo was internal: an access-controlled
          # Pages site is served from the root of a generated host, where
          # "/<repo>/" was the value that broke it. A root-served custom domain
          # (decision 1) would put it back to "/", which is why this is a repo
          # variable rather than a literal.
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      # If/when a custom domain is approved (decision 1 in the hosting
      # doc), drop a CNAME file into the published output here, e.g.:
      #   - run: echo "demos.camunda.io" > dist/CNAME
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
