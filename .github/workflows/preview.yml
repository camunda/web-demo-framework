name: Preview

# Builds every PR and publishes it to a per-PR preview URL, so a reviewer
# can click through to a real deployed page before merge — this repo has
# many parallel issues in flight and "does it work on the deployed page"
# needs answering before merge, not after (issue #19, acceptance
# criterion 2).
#
# Implementation: the preview bundle is published under
# pr-preview/pr-<number>/ on the gh-pages branch, alongside (but never
# overwriting) the production deployment that deploy.yml publishes to the
# root of that same branch. rossjrw/pr-preview-action manages the
# subfolder (publish on open/sync, tear down on close) using only the
# built-in GITHUB_TOKEN — no external hosting account needed.
#
# Two things must stay true for the advertised link to be real, and both
# were broken when these workflows first shipped — which is why previews
# silently resolved to main's deployment:
#
# 1. The repo's Pages source must be "Deploy from a branch" → gh-pages.
#    GitHub Pages serves exactly one source; while it was set to
#    "GitHub Actions" (actions/deploy-pages), nothing ever served this
#    branch. deploy.yml now publishes to gh-pages too, so both live under
#    one source.
# 2. `pages-base-url` must be set explicitly. This repo is **internal**,
#    so its access-controlled Pages site is served from a generated host
#    (https://<random>.pages.github.io/), not from
#    camunda.github.io/web-demo-framework/ — which is what the action
#    assumes by default. That org-path URL redirects to the generated
#    host's ROOT, discarding the pr-preview path, which is precisely how
#    a "preview" link ended up showing main.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs get a read-only GITHUB_TOKEN and can't push to gh-pages, so
    # this job would fail noisily on every fork PR. Same-repo branches only;
    # see docs/hosting-and-deployment.md for the documented limitation.
    #
    # This job only reads the PR branch (default read-only permissions) and
    # uploads the build output as an artifact — it never holds a token that
    # can write to the repo, so untrusted `npm ci`/`npm run build` scripts
    # from the PR branch can't use write credentials even if compromised.
    # The separate `publish` job below is the only one with `contents: write`
    # and it never executes PR-branch code.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Preview is published under pr-preview/pr-<number>/ on gh-pages,
          # so asset URLs must be rooted at that subpath or the preview
          # renders without JS/CSS.
          VITE_BASE_PATH: /pr-preview/pr-${{ github.event.pull_request.number }}/
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist/

  publish:
    # Runs with the write-scoped token. It checks out the trusted base ref
    # (not the PR merge ref) purely so the publish action has a git working
    # tree to operate `gh-pages` from — it never executes PR-branch code; it
    # only downloads the already-built artifact from the `build` job and
    # hands it to the publish action.
    needs: build
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # wait-for-pages-deployment polls /repos/{repo}/pages/builds.
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: dist/
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: dist/
          # Host serving this repo's Pages site. Must be a bare hostname with
          # no scheme and no trailing slash — the action prepends https://
          # itself, so a value like https://example.com yields
          # https://https://example.com/pr-preview/pr-N/. Overridable via the
          # PAGES_BASE_URL repo variable, which is what to set if the
          # generated hostname ever changes (it is regenerated if Pages is
          # disabled and re-enabled) or once a custom domain lands.
          pages-base-url: ${{ vars.PAGES_BASE_URL || 'fluffy-succotash-1vv1kjr.pages.github.io' }}
          # Holds the comment back until the preview is actually reachable.
          # Off until the Pages source is switched to the gh-pages branch:
          # /pages/builds is empty while Pages is workflow-sourced, so the
          # step would poll for 180s and then fail. Set the
          # PAGES_PREVIEW_WAIT repo variable to true once that flip is done.
          wait-for-pages-deployment: ${{ vars.PAGES_PREVIEW_WAIT || false }}

  close:
    # Same fork-PR limitation as the build job above: a fork PR's close
    # event has a read-only token that can't push to gh-pages, so skip it
    # here too instead of failing the cleanup step.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          action: remove
