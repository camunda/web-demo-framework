# Excludes specific paths from secret scanning — including push protection.
# Per GitHub docs, `paths-ignore` here applies to BOTH secret-scanning alerts
# and push protection:
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
#
# Why this exists: the `publish` job in .github/workflows/preview.yml builds the
# site and pushes `dist/` to the `gh-pages` branch (under pr-preview/pr-<n>/) to
# publish a per-PR preview. The vendored `@huggingface/transformers` web build
# emits `assets/transformers.web-<hash>.js`, whose minified contents contain a
# string matching GitHub's "Mistral AI API Key" pattern — a false positive in a
# third-party build artifact. Push protection therefore rejected the gh-pages
# push, failing the preview job on every PR.
#
# We exclude only *build output* (never hand-written source), so real secrets in
# source are still detected and blocked.
paths-ignore:
  # The specific vendored bundle that trips the false positive, wherever a build
  # emits it (matches root `assets/` and `pr-preview/pr-<n>/assets/`).
  - "**/assets/transformers*"
  # The entire per-PR preview tree is generated build output pushed to gh-pages,
  # not source — keep future vendored false positives from re-breaking previews.
  - "pr-preview/**"
