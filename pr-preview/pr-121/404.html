    <!--
      Baseline CSP for a hosted deployment. See docs/security.md for the full
      threat model and the connect-src reasoning (why a local Ollama isn't, and
      shouldn't be, allowlisted here, and why the remote-provider mode costs a
      bare `https:`).
      A <meta> CSP can't set `frame-ancestors` or report-only mode — whoever
      owns hosting (issue #19) should set the equivalent as a real response
      header, not rely on this tag alone.

      `connect-src` covers Hugging Face by wildcard, not by naming CDN hosts.
      WebLLM's prebuilt config points at `huggingface.co`, but a weight download
      302s to whichever storage host serves that repo — today
      `us.aws.cdn.hf.co` (Xet), previously `cdn-lfs.huggingface.co`, and region
      dependent. CSP is enforced on the redirect target, so an allowlist that
      names only the URL WebLLM asks for blocks every model download with an
      unhelpful `Failed to fetch`.

      The bare `https:` source is for the Endpoint brain's remote-provider mode:
      the reader types the base URL of an OpenAI-compatible provider, and no
      static allowlist can enumerate those (a self-hosted vLLM is as valid as
      api.openai.com). `http:` is deliberately absent — a plaintext endpoint is
      blocked as mixed content from an https page anyway, and the local-Ollama
      mode is never reached under this policy: it is offered only on a localhost
      page, and the localhost page is `npm run dev`, where the `strip-dev-csp`
      plugin (vite.config.ts) removes this tag entirely. `'self'` would *not*
      stand in for it — a page on `http://localhost:5174` and a server on
      `:11434` are different origins — so a built page previewed from localhost
      needs a real response header allowing that port if it wants Ollama.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'"
    />
