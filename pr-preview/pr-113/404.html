    <!--
      Baseline CSP for a hosted deployment. See docs/security.md for the full
      threat model and the connect-src reasoning (why the Endpoint/Ollama
      brain's arbitrary local URL isn't, and shouldn't be, allowlisted here).
      A <meta> CSP can't set `frame-ancestors` or report-only mode — whoever
      owns hosting (issue #19) should set the equivalent as a real response
      header, not rely on this tag alone.

      `connect-src` covers Hugging Face by wildcard, not by naming CDN hosts.
      WebLLM's prebuilt config points at `huggingface.co`, but a weight download
      302s to whichever storage host serves that repo — today
      `us.aws.cdn.hf.co` (Xet), previously `cdn-lfs.huggingface.co`, and region
      dependent. CSP is enforced on the redirect target, so an allowlist that
      names only the URL WebLLM asks for blocks every model download with an
      unhelpful `Failed to fetch`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'"
    />
